[project]
name = "whydrift"
version = "0.1.0"
description = "Why do learned simulators drift? AI651, LUMS, Fall 2026"
requires-python = ">=3.11"
# Pinned so every machine reproduces the same numbers.
dependencies = [
    "jax[cpu]==0.12.1",
    "jaxlib==0.12.1",
    "equinox==0.13.8",
    "optax==0.2.9",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "pyyaml==6.0.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whydrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
